# Sveltia CMS 설정 — https://sveltiacms.app/en/docs
# 로그인: GitHub 토큰(Personal Access Token)으로만 로그인한다.
backend:
  name: github
  repo: mmmmmmseong/mmmmmmseong.github.io
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "docs: {{collection}} '{{slug}}' 작성"
    update: "docs: {{collection}} '{{slug}}' 수정"
    delete: "docs: {{collection}} '{{slug}}' 삭제"
    uploadMedia: "docs: 첨부 파일 '{{path}}' 업로드"
    deleteMedia: "docs: 첨부 파일 '{{path}}' 삭제"

app_title: mmmmmmseong 글쓰기
site_url: https://mmmmmmseong.github.io

# Obsidian 과 같은 첨부 폴더를 쓴다.
media_folder: content/attachments
public_folder: /attachments

collections:
  - name: wiki
    label: 위키
    label_singular: 위키 문서
    folder: content/wiki
    create: true
    # 하위 폴더(분류)를 트리로 보여주고, 글마다 폴더를 고를 수 있게 한다.
    nested: { depth: 5, subfolders: false }  # 폴더 안에 일반 .md 파일 (글마다 index.md 폴더를 만드는 방식이 아님)
    meta: { path: { label: 분류 폴더 } }
    summary: "{{title}}"
    sortable_fields: [title, updated]
    preview_path: "wiki/{{dirname}}/{{slug}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 한 줄 설명, widget: string, required: false }
      - name: tags
        label: 태그
        hint: "목록에 없는 태그는 왼쪽 메뉴의 '태그 관리'에서 먼저 추가하세요."
        widget: relation
        collection: taxonomy
        file: tags
        value_field: tags.*.id
        display_fields: [tags.*.name]
        search_fields: [tags.*.name, tags.*.id]
        multiple: true
        required: false
        default: []
      - { name: order, label: 순서, widget: number, value_type: int, default: 0, required: false, hint: "상위 문서 아래에서 하위 문서가 나오는 순서. 작을수록 앞에 나온다." }
      - { name: created, label: 작성일, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}", required: false }
      - { name: updated, label: 수정일, widget: datetime, type: date, format: YYYY-MM-DD, auto_now: true, required: false }
      - { name: draft, label: "비공개 (초안)", widget: boolean, default: false, required: false }
      - { name: body, label: 본문, widget: markdown }

  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    folder: content/projects
    create: true
    # 프로젝트 폴더(예: content/projects/mode/) 안에 하위 문서를 만들 수 있다.
    nested: { depth: 2, subfolders: false }
    meta: { path: { label: 상위 프로젝트 폴더 } }
    summary: "{{title}}"
    sortable_fields: [title, updated, order]
    preview_path: "projects/{{slug}}"
    fields:
      - { name: title, label: 프로젝트 이름, widget: string }
      - { name: summary, label: 한 줄 요약, widget: string, required: false }
      - { name: period, label: 기간, widget: string, required: false, hint: "예: 2025.03 – 2025.06" }
      - { name: role, label: 역할, widget: string, required: false, hint: "예: 백엔드 (팀 4명)" }
      - { name: stack, label: 기술 스택, widget: list, required: false, default: [] }
      - name: tags
        label: 태그
        hint: "목록에 없는 태그는 왼쪽 메뉴의 '태그 관리'에서 먼저 추가하세요."
        widget: relation
        collection: taxonomy
        file: tags
        value_field: tags.*.id
        display_fields: [tags.*.name]
        search_fields: [tags.*.name, tags.*.id]
        multiple: true
        required: false
        default: []
      - { name: github, label: GitHub 주소, widget: string, required: false }
      - { name: demo, label: 데모 주소, widget: string, required: false }
      - { name: thumbnail, label: 대표 이미지, widget: image, required: false }
      - { name: featured, label: 홈에 대표로 표시, widget: boolean, default: false, required: false }
      - { name: order, label: 정렬 순서, widget: number, default: 0, value_type: int, required: false, hint: "프로젝트 목록에서는 클수록 앞, 하위 문서끼리는 작을수록 앞에 나온다." }
      - { name: updated, label: 수정일, widget: datetime, type: date, format: YYYY-MM-DD, auto_now: true, required: false }
      - { name: draft, label: "비공개 (초안)", widget: boolean, default: false, required: false }
      - { name: body, label: 본문, widget: markdown }

  - name: taxonomy
    label: 태그 관리
    files:
      - name: tags
        label: 태그 목록
        file: content/tags.yml
        fields:
          - name: tags
            label: 태그
            label_singular: 태그
            widget: list
            summary: "{{fields.name}} ({{fields.id}})"
            fields:
              - name: id
                label: ID
                widget: string
                hint: "글에 저장되고 주소(/tags/ID)에 쓰이는 값입니다. 한 번 정하면 바꾸지 마세요."
                pattern: ['^[^\s/#?%]+$', "공백과 / # ? % 없이 입력하세요."]
              - { name: name, label: 표시 이름, widget: string, hint: "사이트에 보이는 이름. 바꾸면 모든 글에 반영됩니다." }
              - { name: description, label: 설명, widget: string, required: false }

  - name: pages
    label: 페이지
    files:
      - name: about
        label: 소개
        file: content/pages/about.md
        fields:
          - { name: title, label: 제목, widget: string }
          - { name: description, label: 설명, widget: string, required: false }
          - { name: body, label: 본문, widget: markdown }
