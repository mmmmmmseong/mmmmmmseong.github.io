<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 675' width='820' height='675' font-family='Pretendard, Noto Sans KR, sans-serif'><rect width='820' height='675' fill='#ffffff'/><rect x='12' y='70' width='796' height='158' fill='#f4f5f7' rx='8'/><text x='796' y='90' font-size='13' fill='#8a93a0' text-anchor='end' font-weight='700'>TCP 연결 (4계층)</text><rect x='12' y='236' width='796' height='234' fill='#eef3fb' rx='8'/><text x='796' y='256' font-size='13' fill='#5b7fc4' text-anchor='end' font-weight='700'>TLS 핸드셰이크</text><rect x='12' y='478' width='796' height='132' fill='#edf7f0' rx='8'/><text x='796' y='498' font-size='13' fill='#2e9e4f' text-anchor='end' font-weight='700'>암호화된 HTTP</text><rect x='65' y='16' width='170' height='38' rx='8' fill='#2f4f73'/><text x='150.0' y='40.0' font-size='15' fill='#ffffff' text-anchor='middle' font-weight='700'>클라이언트 (브라우저)</text><line x1='150' y1='54' x2='150' y2='630' stroke='#c9ced6' stroke-width='2' stroke-dasharray='5 4'/><rect x='585' y='16' width='170' height='38' rx='8' fill='#2f4f73'/><text x='670.0' y='40.0' font-size='15' fill='#ffffff' text-anchor='middle' font-weight='700'>서버</text><line x1='670' y1='54' x2='670' y2='630' stroke='#c9ced6' stroke-width='2' stroke-dasharray='5 4'/><line x1='150' y1='90' x2='670' y2='120' stroke='#8a93a0' stroke-width='2.2'/><path d='M658,114 L670,120 L658,126' fill='#8a93a0'/><rect x='260.0' y='90.0' width='300' height='30' fill='#f4f5f7'/><text x='410.0' y='110.0' font-size='14.5' fill='#8a93a0' text-anchor='middle' font-weight='700'>SYN</text><line x1='670' y1='140' x2='150' y2='170' stroke='#8a93a0' stroke-width='2.2'/><path d='M162,164 L150,170 L162,176' fill='#8a93a0'/><rect x='260.0' y='140.0' width='300' height='30' fill='#f4f5f7'/><text x='410.0' y='160.0' font-size='14.5' fill='#8a93a0' text-anchor='middle' font-weight='700'>SYN-ACK</text><line x1='150' y1='190' x2='670' y2='220' stroke='#8a93a0' stroke-width='2.2'/><path d='M658,214 L670,220 L658,226' fill='#8a93a0'/><rect x='260.0' y='190.0' width='300' height='30' fill='#f4f5f7'/><text x='410.0' y='210.0' font-size='14.5' fill='#8a93a0' text-anchor='middle' font-weight='700'>ACK</text><line x1='150' y1='258' x2='670' y2='300' stroke='#5b7fc4' stroke-width='2.2'/><path d='M658,294 L670,300 L658,306' fill='#5b7fc4'/><rect x='260.0' y='256.0' width='300' height='46' fill='#eef3fb'/><text x='410.0' y='276.0' font-size='14.5' fill='#5b7fc4' text-anchor='middle' font-weight='700'>ClientHello</text><text x='410.0' y='292.0' font-size='12.5' fill='#6b7380' text-anchor='middle' font-weight='400'>지원하는 암호 방식 목록 + 내 키 교환 값</text><line x1='670' y1='330' x2='150' y2='372' stroke='#5b7fc4' stroke-width='2.2'/><path d='M162,366 L150,372 L162,378' fill='#5b7fc4'/><rect x='260.0' y='328.0' width='300' height='46' fill='#eef3fb'/><text x='410.0' y='348.0' font-size='14.5' fill='#5b7fc4' text-anchor='middle' font-weight='700'>ServerHello + 인증서 + Finished</text><text x='410.0' y='364.0' font-size='12.5' fill='#6b7380' text-anchor='middle' font-weight='400'>고른 암호 방식 + 서버 키 교환 값</text><rect x='80' y='388' width='140' height='34' rx='6' fill='#ffffff' stroke='#5b7fc4'/><text x='150.0' y='410.0' font-size='13.5' fill='#5b7fc4' text-anchor='middle' font-weight='700'>인증서 확인</text><line x1='150' y1='432' x2='670' y2='462' stroke='#5b7fc4' stroke-width='2.2'/><path d='M658,456 L670,462 L658,468' fill='#5b7fc4'/><rect x='260.0' y='432.0' width='300' height='30' fill='#eef3fb'/><text x='410.0' y='452.0' font-size='14.5' fill='#5b7fc4' text-anchor='middle' font-weight='700'>Finished</text><line x1='150' y1='500' x2='670' y2='540' stroke='#2e9e4f' stroke-width='2.2'/><path d='M658,534 L670,540 L658,546' fill='#2e9e4f'/><rect x='260.0' y='505.0' width='300' height='30' fill='#edf7f0'/><text x='410.0' y='525.0' font-size='14.5' fill='#2e9e4f' text-anchor='middle' font-weight='700'>GET / (암호화됨)</text><line x1='670' y1='562' x2='150' y2='602' stroke='#2e9e4f' stroke-width='2.2'/><path d='M162,596 L150,602 L162,608' fill='#2e9e4f'/><rect x='260.0' y='567.0' width='300' height='30' fill='#edf7f0'/><text x='410.0' y='587.0' font-size='14.5' fill='#2e9e4f' text-anchor='middle' font-weight='700'>200 OK + HTML (암호화됨)</text><text x='410.0' y='655.0' font-size='13.5' fill='#6b7380' text-anchor='middle' font-weight='400'>양쪽이 주고받은 키 교환 값으로 같은 세션 키를 계산한다. 키 자체는 네트워크로 오가지 않는다</text></svg>